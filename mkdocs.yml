site_name: MultiworldGG-Index docs
site_description: How APWorld authors release their worlds onto MultiworldGG-Index.
site_url: https://multiworldgg.github.io/multiworldgg-index/
repo_url: https://github.com/MultiworldGG/MultiworldGG-Index

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: mwgg_dark
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: mwgg_light
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.tabs
    - navigation.expand
    - navigation.indexes

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Why do we Have Oliver: why-oliver.md
  - I want the easiest setup:
    - easy/index.md
    - From an Archipelago fork: easy/from-archipelago-fork.md
  - I want the fully custom setup:
    - advanced/index.md
    - From an Archipelago fork: advanced/from-archipelago-fork.md
    - From a standalone repo: advanced/from-standalone-repo.md
  - Reference:
    - archipelago.json schema: reference/archipelago-json.md
    - Reusable workflows: reference/workflows.md
    - Troubleshooting: reference/troubleshooting.md
  - Glossary: glossary.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.snippets
  - toc:
      permalink: true
