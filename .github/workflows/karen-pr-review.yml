name: Karen's PR review

# Karen is the default reviewer (via CODEOWNERS) for apworld updates.
# This workflow runs Karen's 8 security checks on every PR change against `main`,
# posts a sticky PR comment summarising the results, and requests human review
# only when all checks are green.
#
# Triggers on changes to worlds/** or schema/**.
#
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "worlds/**"
      - "schema/**"
      - "scripts/karen_review.py"

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: karen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Mint Karen's installation token
        uses: actions/create-github-app-token@v3
        id: karen_token
        with:
          client-id: ${{ vars.KAREN_APP_ID }}
          private-key: ${{ secrets.KAREN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Karen's deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Detect changed manifests
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # All files changed in this PR
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt

          grep -E '^worlds/[^/]+\.json$' changed-files.txt > karen-targets.txt || true
          schema_changed=$(grep -E '^schema/' changed-files.txt || true)

          target_count=$(wc -l < karen-targets.txt | tr -d '[:space:]')
          echo "target_count=${target_count}" >> "$GITHUB_OUTPUT"
          echo "Changed worlds:"
          cat karen-targets.txt || true

          if [ -n "${schema_changed}" ]; then
            echo "schema_changed=true" >> "$GITHUB_OUTPUT"
            echo "Schema changed -> will run fast checks against ALL manifests"
          else
            echo "schema_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Karen (full suite on changed manifests)
        id: karen
        if: steps.detect.outputs.target_count != '0'
        run: |
          set -euo pipefail
          # Build --changed args from karen-targets.txt
          args=()
          while IFS= read -r path; do
            [ -n "$path" ] && args+=("--changed" "$path")
          done < karen-targets.txt

          # Fast manifest-only checks on the runner; wheel download, size_sanity,
          # bandit, pip-audit and fuzzing all move to the sandboxed bot.
          set +e
          python scripts/karen_review.py \
            "${args[@]}" \
            --schema schema/world_manifest.schema.json \
            --check schema --check manifest_consistency --check url_reachability \
            --output-comment karen-comment.md \
            --output-summary karen-summary.json
          karen_exit=$?
          set -e

          overall=$(jq -r .overall karen-summary.json)
          echo "overall=${overall}" >> "$GITHUB_OUTPUT"
          echo "exit=${karen_exit}" >> "$GITHUB_OUTPUT"

      - name: Run Karen (schema validation across ALL manifests)
        id: karen_schema_only
        if: steps.detect.outputs.schema_changed == 'true' && steps.detect.outputs.target_count == '0'
        run: |
          set -euo pipefail
          # Schema changed but no specific manifests touched: validate all 229
          # against the new schema using only the fast checks (no clone, no
          # bandit, no pip-audit). Typical runtime: under 10 seconds.
          args=()
          for path in worlds/*.json; do
            args+=("--changed" "$path")
          done

          set +e
          python scripts/karen_review.py \
            "${args[@]}" \
            --schema schema/world_manifest.schema.json \
            --check schema --check manifest_consistency \
            --output-comment karen-comment.md \
            --output-summary karen-summary.json
          karen_exit=$?
          set -e

          overall=$(jq -r .overall karen-summary.json)
          echo "overall=${overall}" >> "$GITHUB_OUTPUT"
          echo "exit=${karen_exit}" >> "$GITHUB_OUTPUT"

      - name: Skip-trivial comment
        if: steps.detect.outputs.target_count == '0' && steps.detect.outputs.schema_changed != 'true'
        run: |
          cat > karen-comment.md <<'EOF'
          <!-- karen-pr-review -->
          ## Karen: Quality Assurance Manager

          No `worlds/*.json` files in scope for this PR.
          EOF

      # The heavyweight wheel scanning + world fuzzing run in a sandboxed bot,
      # not on this runner. Build a repository_dispatch payload describing the
      # changed worlds and hand it off; the bot reports back via the
      # `Karen / fuzz` Check Run and splices results into the sticky comment.
      - name: Build fuzz dispatch payload
        id: build_payload
        if: steps.detect.outputs.target_count != '0'
        run: |
          set -euo pipefail

          # Per-PR overrides via labels (fall back to defaults). Keep these
          # within the bot validator's accepted ranges (runs 1..500,
          # timeout_s 5..300) or they are silently clamped on the bot side.
          fuzz_runs=50
          fuzz_timeout=30
          size_cap=250
          while IFS= read -r label; do
            case "$label" in
              karen/fuzz-runs:*)    fuzz_runs="${label#karen/fuzz-runs:}" ;;
              karen/fuzz-timeout:*) fuzz_timeout="${label#karen/fuzz-timeout:}" ;;
              karen/size-cap-mb:*)  size_cap="${label#karen/size-cap-mb:}" ;;
            esac
          done < <(jq -r '.pull_request.labels[].name' < "$GITHUB_EVENT_PATH")
          echo "fuzz runs=${fuzz_runs} timeout=${fuzz_timeout}s size_cap=${size_cap}MB"

          # Build the worlds[] array, one entry per changed manifest whose
          # module_location is an https://....whl URL. Skip-and-warn the rest.
          : > worlds.ndjson
          while IFS= read -r manifest_path; do
            [ -n "$manifest_path" ] || continue
            apworld="$(basename "$manifest_path" .json)"
            module_location="$(jq -r '.module_location // ""' "$manifest_path")"
            wheel_url="${module_location%%#*}"
            sha256="${module_location##*#sha256=}"

            if ! echo "$wheel_url" | grep -qE '^https://.*\.whl$'; then
              echo "::warning::Skipping ${apworld}: module_location is not an https:// .whl URL (got: ${module_location:0:60})"
              continue
            fi

            jq -n \
              --arg apworld "${apworld}" \
              --arg manifest_path "${manifest_path}" \
              --arg game "$(jq -r '.game // ""' "$manifest_path")" \
              --arg world_version "$(jq -r '.world_version // ""' "$manifest_path")" \
              --arg wheel_url "${wheel_url}" \
              --arg sha256 "${sha256}" \
              '{apworld:$apworld, manifest_path:$manifest_path, game:$game, world_version:$world_version, wheel_url:$wheel_url, sha256:$sha256}' \
              >> worlds.ndjson
          done < karen-targets.txt

          world_count="$(grep -c . worlds.ndjson || true)"
          echo "world_count=${world_count}" >> "$GITHUB_OUTPUT"
          if [ "${world_count}" = "0" ]; then
            echo "::notice::No fuzzable worlds (all skipped); not dispatching."
            exit 0
          fi

          # Assemble dispatch-payload.json with jq for safe escaping.
          jq -n \
            --arg index_repo "${{ github.repository }}" \
            --argjson pr_number "${{ github.event.pull_request.number }}" \
            --arg head_sha "${{ github.event.pull_request.head.sha }}" \
            --argjson fuzz_runs "${fuzz_runs}" \
            --argjson fuzz_timeout "${fuzz_timeout}" \
            --argjson size_cap "${size_cap}" \
            --slurpfile worlds worlds.ndjson \
            '{
              event_type: "karen-fuzz",
              client_payload: {
                schema_version: 1,
                index_repo: $index_repo,
                pr_number: $pr_number,
                head_sha: $head_sha,
                check_run_name: "Isolated QA Checks",
                comment_marker: "<!-- karen-pr-review -->",
                fuzz: { runs: $fuzz_runs, timeout_s: $fuzz_timeout, yamls: "1-10", threads: 10 },
                scan: { size_cap_mb: $size_cap },
                worlds: $worlds
              }
            }' > dispatch-payload.json
          echo "Built dispatch-payload.json:"
          jq . dispatch-payload.json

      - name: Dispatch fuzz job to the bot
        if: steps.detect.outputs.target_count != '0' && steps.build_payload.outputs.world_count != '0'
        env:
          GH_TOKEN: ${{ steps.karen_token.outputs.token }}
        run: |
          set -euo pipefail
          gh api -X POST repos/${{ github.repository }}/dispatches --input dispatch-payload.json

      - name: Create pending fuzz Check Run
        if: steps.detect.outputs.target_count != '0' && steps.build_payload.outputs.world_count != '0'
        env:
          GH_TOKEN: ${{ steps.karen_token.outputs.token }}
        run: |
          set -euo pipefail
          # Create the required `Karen / fuzz` context immediately so the PR
          # shows it as pending; the bot transitions it to its final state.
          gh api -X POST repos/${{ github.repository }}/check-runs \
            -f name='Isolated QA Checks' \
            -f head_sha='${{ github.event.pull_request.head.sha }}' \
            -f status=queued

      - name: Upload Karen artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: karen-review
          path: |
            karen-comment.md
            karen-summary.json
          if-no-files-found: warn

      # karen_review.py owns the comment body, so append a placeholder fenced
      # region the bot can splice its sandbox fuzz/scan results into. Only when
      # a fuzz job was actually dispatched.
      - name: Add fuzz placeholder to sticky comment
        if: steps.build_payload.outputs.world_count != '' && steps.build_payload.outputs.world_count != '0'
        run: |
          set -euo pipefail
          [ -f karen-comment.md ] || exit 0
          {
            echo ""
            echo "<!-- karen-fuzz:start -->"
            echo "Sandbox fuzz/scan: running…"
            echo "<!-- karen-fuzz:end -->"
          } >> karen-comment.md

      - name: Post or update sticky PR comment
        if: steps.karen_token.outputs.token != '' && always()
        env:
          GH_TOKEN: ${{ steps.karen_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f karen-comment.md ]; then
            echo "no comment to post"
            exit 0
          fi
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("<!-- karen-pr-review -->")) | .id' \
            | head -n 1 || true)
          if [ -n "${existing}" ]; then
            echo "updating comment ${existing}"
            # `gh api -f body=@file` does NOT expand @ to file contents — it
            # treats the value as the literal string. Build a JSON body with
            # jq's --rawfile and pipe it via --input -.
            jq -n --rawfile body karen-comment.md '{body: $body}' | \
              gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" --input - >/dev/null
          else
            echo "creating new comment"
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file karen-comment.md
          fi

      - name: Request human review on green
        if: steps.karen.outputs.overall == 'pass' || steps.karen_schema_only.outputs.overall == 'pass'
        env:
          GH_TOKEN: ${{ steps.karen_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REVIEWERS: ${{ vars.KAREN_HUMAN_REVIEWERS }}
        run: |
          set -euo pipefail
          if [ -z "${REVIEWERS:-}" ]; then
            echo "KAREN_HUMAN_REVIEWERS variable is unset; skipping review request."
            exit 0
          fi
          # vars.KAREN_HUMAN_REVIEWERS is a comma-separated list, e.g.
          # "user1,team:org/maintainers,user2"
          users=()
          teams=()
          IFS=',' read -ra ENTRIES <<< "${REVIEWERS}"
          for entry in "${ENTRIES[@]}"; do
            entry="${entry//[[:space:]]/}"
            [ -z "${entry}" ] && continue
            case "${entry}" in
              team:*)
                teams+=("${entry#team:}")
                ;;
              *)
                users+=("${entry}")
                ;;
            esac
          done
          args=()
          if [ "${#users[@]}" -gt 0 ]; then
            args+=("--add-reviewer" "$(IFS=,; echo "${users[*]}")")
          fi
          if [ "${#teams[@]}" -gt 0 ]; then
            args+=("--add-reviewer" "$(IFS=,; echo "${teams[*]}")")
          fi
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" "${args[@]}" || {
            echo "review request failed (often: reviewer already requested or insufficient perms); not blocking."
          }

      - name: Fail the check on red
        if: |
          (steps.karen.outputs.exit != '' && steps.karen.outputs.exit != '0') ||
          (steps.karen_schema_only.outputs.exit != '' && steps.karen_schema_only.outputs.exit != '0')
        run: |
          echo "Karen reported red checks; failing the workflow."
          exit 1

      # Tag the PR head as `igdb-pr-<number>` if the PR carries the
      # "Needs IGDB id" label. 
      - name: Tag PR head if 'Needs IGDB id' label is present
        if: steps.karen_token.outputs.token != '' && always()
        env:
          GH_TOKEN: ${{ steps.karen_token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          has_label=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" \
            --jq '[.[] | select(.name == "Needs IGDB id")] | length')
          if [ "${has_label}" = "0" ]; then
            echo "PR does not have 'Needs IGDB id' label; skipping tag creation."
            exit 0
          fi
          tag="igdb-pr-${PR_NUMBER}"
          if gh api "repos/${REPO}/git/refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; skipping (no force-update)."
            exit 0
          fi
          gh api -X POST "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${HEAD_SHA}"
          echo "Created tag ${tag} at ${HEAD_SHA}"

      - name: Karen submits APPROVE on green
        if: |
          steps.karen_token.outputs.token != '' &&
          (steps.karen.outputs.overall == 'pass' || steps.karen_schema_only.outputs.overall == 'pass')
        env:
          GH_TOKEN: ${{ steps.karen_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            -f event=APPROVE \
            -f body="APPROVED: Manifest checks passed, awesome job! Note: the sandbox fuzz/scan runs as a separate required check (\`Karen / fuzz\`) and must also be green before merge."

      - name: Karen submits REQUEST_CHANGES on red
        if: |
          steps.karen_token.outputs.token != '' &&
          (
            (steps.karen.outputs.exit != '' && steps.karen.outputs.exit != '0') ||
            (steps.karen_schema_only.outputs.exit != '' && steps.karen_schema_only.outputs.exit != '0')
          )
        env:
          GH_TOKEN: ${{ steps.karen_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Compose a short body; the sticky comment already has details.
          body="Karen failed the apworld checks. See Karen's quality review comment for the breakdown."
          gh api -X POST "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            -f event=REQUEST_CHANGES \
            -f body="${body}" || {
              echo "REQUEST_CHANGES POST failed (may be unsupported on draft PRs); not blocking."
            }
