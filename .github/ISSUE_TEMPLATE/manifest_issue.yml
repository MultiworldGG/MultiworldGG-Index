name: Manifest data issue
description: Wrong / missing data in a `worlds/<apworld>.json` entry (game name, IGDB id, version, URL, etc.)
title: "[manifest] <apworld>: <short description>"
labels: ["manifest"]
body:
  - type: input
    id: apworld
    attributes:
      label: APWorld
      description: Filename of your apworld under `worlds/`
      placeholder: "oot"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What's wrong, and what should it be?
      placeholder: "Currently `igdb_id: 123`, should be `igdb_id: 456` (IGDB link: ...)"
    validations:
      required: true

