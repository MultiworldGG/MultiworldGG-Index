name: Index infrastructure change request
description: Propose a change to the index infrastructure, including the manifest schema, Karen's checks, the variant build, or the index workflows.
title: "[infra] <area>: <short description>"
labels: ["infra"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: How can we help?
      description: What use case isn't supported today, or what's not working as expected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Concrete description of the change and any backward-compat concerns.
    validations:
      required: true

